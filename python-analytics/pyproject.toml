[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basketball-analytics-service"
version = "0.1.0"
description = "Python analytics service for lineup recommendation and win-rate prediction."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.116.1,<1.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
